{% extends "base.html" %}
{% block title %}Connexion · CyberCopilot{% endblock %}
{% block content %}

<div class="min-h-screen gradient-bg flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-5xl font-bold text-cyber-500 mb-2">🛡️ CyberCopilot</h1>
      <p class="text-slate-300">Votre copilote SOC en français</p>
    </div>

    <div class="bg-white rounded-xl shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-navy mb-6 text-center">Connexion</h2>

      {% if error %}
      <div class="bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded mb-4">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" name="email" required
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyber-500 focus:border-cyber-500 outline-none"
                 placeholder="vous@exemple.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
          <input type="password" name="password" required
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyber-500 focus:border-cyber-500 outline-none"
                 placeholder="••••••••">
        </div>
        <button type="submit"
                class="w-full bg-cyber-500 hover:bg-cyber-600 text-white font-semibold py-2 px-4 rounded-lg transition">
          Se connecter
        </button>
      </form>

      <p class="text-center text-sm text-slate-600 mt-6">
        Pas encore de compte ?
        <a href="/signup" class="text-cyber-600 hover:text-cyber-700 font-semibold">Créer un compte</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}

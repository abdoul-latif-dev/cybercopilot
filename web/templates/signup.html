{% extends "base.html" %}
{% block title %}Inscription · CyberCopilot{% endblock %}
{% block content %}

<div class="min-h-screen gradient-bg flex items-center justify-center px-4 py-8">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-5xl font-bold text-cyber-500 mb-2">🛡️ CyberCopilot</h1>
      <p class="text-slate-300">Rejoignez la communauté des analystes SOC</p>
    </div>

    <div class="bg-white rounded-xl shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-navy mb-6 text-center">Créer un compte</h2>

      {% if error %}
      <div class="bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded mb-4">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/signup" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nom complet</label>
          <input type="text" name="full_name"
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyber-500 focus:border-cyber-500 outline-none"
                 placeholder="Prénom Nom">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email <span class="text-red-500">*</span></label>
          <input type="email" name="email" required
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyber-500 focus:border-cyber-500 outline-none"
                 placeholder="vous@exemple.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe <span class="text-red-500">*</span></label>
          <input type="password" name="password" required minlength="6"
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyber-500 focus:border-cyber-500 outline-none"
                 placeholder="6 caractères minimum">
        </div>
        <button type="submit"
                class="w-full bg-cyber-500 hover:bg-cyber-600 text-white font-semibold py-2 px-4 rounded-lg transition">
          Créer mon compte
        </button>
      </form>

      <p class="text-center text-sm text-slate-600 mt-6">
        Déjà un compte ?
        <a href="/login" class="text-cyber-600 hover:text-cyber-700 font-semibold">Se connecter</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}

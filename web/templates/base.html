<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CyberCopilot{% endblock %}</title>
<meta name="description" content="Assistant SOC intelligent basé sur les LLM — détection automatique d'attaques sur logs de sécurité">
<meta name="theme-color" content="#0F1729">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E🛡️%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        navy: '#0F1729',
        cyber: { 50: '#ECFEFF', 500: '#06B6D4', 600: '#0891B2', 700: '#0E7490' },
      }
    }
  }
}
</script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.gradient-bg { background: linear-gradient(135deg, #0F1729 0%, #1E293B 100%); }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

{% if user %}
<nav class="bg-navy text-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <a href="/dashboard" class="flex items-center gap-2 text-xl font-bold text-cyber-500">
        🛡️ CyberCopilot
      </a>
      <div class="flex items-center gap-5 text-sm">
        <a href="/dashboard" class="hover:text-cyber-500 transition">📋 Dashboard</a>
        <a href="/upload" class="hover:text-cyber-500 transition">📤 Analyser</a>
        <a href="/stats" class="hover:text-cyber-500 transition">📊 Statistiques</a>
        <a href="/chat" class="hover:text-cyber-500 transition">💬 Chat</a>
        <a href="/export" class="hover:text-cyber-500 transition">📥 Export</a>
        <a href="/settings" class="hover:text-cyber-500 transition">⚙️ Paramètres</a>
        <div class="border-l border-slate-600 pl-5 flex items-center gap-3">
          <span class="text-slate-400">👤 {{ user.full_name or user.email }}</span>
          <a href="/logout" class="text-red-400 hover:text-red-300 transition">Déconnexion</a>
        </div>
      </div>
    </div>
  </div>
</nav>
{% endif %}

<main class="flex-1">
  {% block content %}{% endblock %}
</main>

<footer class="bg-navy text-slate-400 py-4 text-center text-sm mt-12">
  🛡️ CyberCopilot — Projet B2 · 2026 · <a href="https://github.com/abdoul-latif-dev/cybercopilot" class="text-cyber-500 hover:underline">GitHub</a>
</footer>

</body>
</html>

# Configuration de déploiement Render — CyberCopilot
# https://render.com/docs/blueprint-spec
#
# Déploiement via Docker pour supporter WeasyPrint (export PDF) qui nécessite
# pango, cairo et autres libs système.

services:
  - type: web
    name: cybercopilot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-5
